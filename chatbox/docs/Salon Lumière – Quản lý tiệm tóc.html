<div id="login"><div class="lg"><div class="logo">Salon <i>Lumière</i></div><p class="sub" style="margin-top:6px">Đăng nhập để quản lý tiệm</p>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

let staff=[['Nguyễn Thu Hà','0901234567','12 Lê Duẩn, Đà Nẵng','048195001234','2023-03-01',['Cắt tóc','Nhuộm','Gội đầu & tạo kiểu']],['Trần Minh Khoa','0912345678','45 Hoàng Diệu, Đà Nẵng','048192004567','2022-08-15',['Cắt tóc','Uốn','Duỗi']],['Lê Bảo Ngọc','0933456789','7 Nguyễn Văn Linh, Đà Nẵng','048197007890','2024-01-10',['Nhuộm','Tẩy tóc','Phục hồi & dưỡng tóc']],['Phạm Quốc Việt','0944567890','90 Trần Phú, Đà Nẵng','048193002345','2021-11-20',['Cắt tóc','Gội đầu & tạo kiểu','Uốn','Nối tóc']]].map((a,i)=>({id:'NV'+String(i+1).padStart(3,'0'),name:a[0],phone:a[1],addr:a[2],cccd:a[3],join:a[4],skills:a[5]}));
let ap=[['Nguyễn Văn An','0987111222',['Cắt tạo kiểu','M'],0,'13:00',1,'Mới đặt',''],['Trần Thị Bình','0987333444',['Uốn (sản phẩm ART)','L'],0,'10:00',0,'Đang phục vụ','Muốn giữ độ dài'],['Lê Hoàng Cường','0987555666',['Phục hồi Biotin','L'],0,'13:30',2,'Mới đặt','Khách quen'],['Phạm Mai Anh','0987777888',['Gội đầu','M'],0,'15:00',3,'Mới đặt',''],['Đỗ Thanh Tâm','0987999000',['Nhuộm (sản phẩm ART)','M'],1,'09:30',0,'Mới đặt',''],['Võ Ngọc Hân','0976111222',['Hấp dầu','S'],-1,'14:00',0,'Hoàn thành',''],['Bùi Gia Huy','0976333444',['Tẩy 1 lần','L'],1,'11:00',2,'Mới đặt','Ảnh mẫu gửi qua chat']].map((a,i)=>({id:'LH'+String(i+1).padStart(3,'0'),cust:a[0],phone:a[1],svc:svc.find(x=>x.name==a[2][0]).id,size:a[2][1],date:addD(a[3]),start:a[4],staff:staff[a[5]].id,status:a[6],note:a[7]}));
let shifts=[];staff.forEach((s,i)=>{for(let d=-14;d<35;d++){const dt=new Date();dt.setDate(dt.getDate()+d);const w=dt.getDay();if(w==(i+4)%7&&Math.abs(d)>1)continue;shifts.push({id:shifts.length,staff:s.id,date:ymd(dt),from:i%2?'12:00':'08:00',to:i%2?'21:00':'17:00'})}});
const now=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
let chats=[{name:'Nguyễn Văn An',mode:'bot',msgs:[['Chào salon, mình muốn đặt cắt tóc lúc 9h được không?','c','08:12'],['Dạ chào anh An! Salon còn trống khung 09:00. Anh cho em xin số điện thoại để giữ lịch nhé.','bot','08:12'],['0987111222','c','08:14'],['Em đã ghi nhận lịch cắt tạo kiểu lúc 09:00. Hẹn gặp anh!','bot','08:14']]},{name:'Trần Thị Bình',mode:'staff',msgs:[['Mình đến trễ 10 phút nhé.','c','09:40'],['Dạ được ạ, bên em đã ghi chú giúp chị.','staff','09:42']]},{name:'Bùi Gia Huy',mode:'wait',msgs:[['Mình gửi ảnh kiểu nhuộm muốn làm nè.','c','16:02'],['Dạ em đã nhận ảnh. Chị muốn nhuộm kèm tẩy tóc phải không ạ?','bot','16:02'],['Mình muốn gặp nhân viên tư vấn màu trực tiếp.','c','16:04'],['Em đã báo nhân viên hỗ trợ, chị chờ trong giây lát nhé.','bot','16:04']]},{name:'Đỗ Thanh Tâm',mode:'bot',msgs:[['Dịch vụ nhuộm giá bao nhiêu vậy?','c','10:20'],['Dạ nhuộm (sản phẩm ART) size S 229.000đ, M 249.000đ, L 279.000đ ạ. Chị cho em biết độ dài tóc để em báo đúng size nhé.','bot','10:20']]}].map(c=>({...c,msgs:c.msgs.map(m=>({t:m[0],from:m[1],time:m[2]}))}));

function form(title,fs,v,cb,btn='Lưu'){modal(`<h3>${title}</h3><form id="f">${fs.map(f=>{const x=v[f.k]??'';let i;
if(f.t=='select')i=`<select name="${f.k}" ${f.ro?'disabled':''}>${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==x?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;

$('#f').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),o={};fs.forEach(f=>o[f.k]=f.t=='checks'?fd.getAll(f.k):f.ro?v[f.k]:fd.get(f.k));if(cb(o)!==false)closeM()}}
const ask=(msg,fn)=>modal(`<h3>Xác nhận xóa</h3><p>${msg}</p><div class="act"><button class="btn ghost" onclick="closeM()">Hủy</button><button class="btn red" id="ok">Xóa</button></div>`)||($('#ok').onclick=()=>{closeM();fn()});

function head(){const items=[['appt','Quản lý lịch hẹn'],['svc','Quản lý dịch vụ'],['chat','Theo dõi chat']];if(own())items.push(['staff','Quản lý nhân viên & lịch làm việc']);const un=N.filter(n=>!n.read).length;
$('#side').innerHTML=`<div class="logo">Salon <i>Lumière</i></div>${items.map(i=>`<button class="nv ${S.page==i[0]?'on':''}" onclick="nav('${i[0]}')">${i[1]}</button>`).join('')}<div class="who"><div class="bw"><button class="bell" onclick="S.np=!S.np;head()" aria-label="Thông báo${un?`, ${un} chưa đọc`:''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>${un?`<i>${un}</i>`:''}</button>${S.np?npanel():''}</div><span><b>${own()?'Chị Lan':'Minh Thư'}</b> · ${own()?'Chủ tiệm':'Lễ tân'}</span><button class="btn ghost sm" onclick="location.reload()">Đăng xuất</button></div>`}
function npanel(){return `<div class="np"><h4>Thông báo<button class="btn ghost sm" onclick="N.forEach(n=>n.read=true);head()">Đánh dấu đã đọc</button></h4>${N.length?N.map((n,i)=>`<button class="ni ${n.read?'':'u'}" onclick="openN(${i})">${esc(chats[n.ci].name)} ${n.k=='human'?'yêu cầu gặp nhân viên':'vừa nhắn tin với chatbot'}<small>${n.k=='human'?'Khách đang nhắn với chatbot AI và muốn được nhân viên hỗ trợ':'Chatbot AI đang tự động trả lời'} · ${n.time}</small></button>`).join(''):'<div style="padding:16px;color:var(--mut)">Chưa có thông báo.</div>'}</div>`}
function openN(i){const n=N[i];n.read=true;S.np=false;S.chat=n.ci;S.page='chat';render()}
document.addEventListener('click',e=>{if(S.np&&!e.target.closest('.bw')){S.np=false;head()}});
function render(){head();({appt:rAppt,svc:rSvc,chat:rChat,staff:rStaff})[S.page]()}

/* ---------- Lịch hẹn ---------- */
function endT(a){return ft(tm(a.start)+(sv(a.svc).dur||0))}
const bc=s=>'bd s'+(ST.indexOf(s)+1);
function rAppt(){
const list=ap.filter(a=>(!S.q||a.cust.toLowerCase().includes(S.q.toLowerCase()))&&(!S.fd||a.date==S.fd)&&(!S.fh||a.start.slice(0,2)==S.fh)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
const hrs=[...Array(13)].map((_,i)=>String(8+i).padStart(2,'0'));
$('#main').innerHTML=`<h2>Quản lý lịch hẹn</h2><p class="sub">Tạo, sửa và theo dõi lịch hẹn của khách</p>
<div class="tabs"><button class="tab ${S.view=='cust'?'on':''}" onclick="S.view='cust';rAppt()">Theo bảng đặt lịch khách hàng</button><button class="tab ${S.view=='staff'?'on':''}" onclick="S.view='staff';rAppt()">Theo lịch nhân viên</button></div>
<div class="bar"><input id="q" placeholder="Tìm tên khách hàng…" value="${esc(S.q)}" aria-label="Tìm khách"><input type="date" id="fd" value="${S.fd}" aria-label="Lọc ngày">
<select id="fh" aria-label="Lọc giờ"><option value="">Mọi giờ bắt đầu</option>${hrs.map(h=>`<option value="${h}" ${S.fh==h?'selected':''}>${h}:00</option>`).join('')}</select>
<button class="btn ghost" onclick="S.q=S.fd=S.fh='';rAppt()">Xóa lọc</button><span class="sp"></span><button class="btn" onclick="apForm()">+ Tạo lịch hẹn</button></div>
<div class="card">${S.view=='cust'?`<div class="tw"><table><tr><th>Mã lịch hẹn</th><th>Tên khách hàng</th><th>Dịch vụ</th><th>Thời gian</th><th>Trạng thái</th><th class="ac">Thao tác</th></tr>
${list.map(a=>`<tr><td>${a.id}</td><td>${esc(a.cust)}</td><td>${esc(sv(a.svc).name)} (${a.size})</td><td>${fdate(a.date)} · ${a.start} - ${endT(a)}</td><td><span class="${bc(a.status)}">${a.status}</span></td><td class="ac">${ib('eye','Xem chi tiết',`apView('${a.id}')`)}${ib('edit','Sửa',`apForm('${a.id}')`)}${ib('del','Xóa',`apDel('${a.id}')`,'d')}</td></tr>`).join('')||'<tr><td colspan="7">Không có lịch hẹn phù hợp. Thử xóa bộ lọc hoặc tạo lịch mới.</td></tr>'}</table></div>`:staffGrid(list)}</div>`;
$('#q').oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;rAppt();const q=$('#q');q.focus();q.setSelectionRange(p,p)};
$('#fd').onchange=e=>{S.fd=e.target.value;rAppt()};$('#fh').onchange=e=>{S.fh=e.target.value;rAppt()}}
function staffGrid(list){const d=S.fd||today;
return `<div style="padding:10px 14px;font-weight:600">Ngày ${fdate(d)}${S.fd?'':' (hôm nay)'}</div><div class="tw"><div class="gr" style="--n:${staff.length}"><div class="h"></div>${staff.map(s=>`<div class="h">${esc(s.name)}</div>`).join('')}
<div>${[...Array(13)].map((_,i)=>`<div class="t">${String(8+i).padStart(2,'0')}:00</div>`).join('')}</div>
${staff.map(s=>`<div class="col" style="height:${13*52}px">${list.filter(a=>a.staff==s.id&&a.date==d&&a.status!='Đã hủy').map(a=>{const top=(tm(a.start)-480)/60*52,h=Math.max(26,(sv(a.svc).dur||30)/60*52-2);return `<div class="ev" style="top:${top}px;height:${h}px" onclick="apView('${a.id}')"><b>${esc(a.cust)}</b>${a.start}-${endT(a)} · ${esc(sv(a.svc).name)}</div>`}).join('')}</div>`).join('')}</div></div>`}
function apView(id){const a=ap.find(x=>x.id==id);modal(`<h3>Chi tiết lịch hẹn</h3><dl class="dl"><dt>Mã lịch hẹn</dt><dd>${a.id}</dd><dt>Tên khách hàng</dt><dd>${esc(a.cust)} · ${esc(a.phone)}</dd><dt>Dịch vụ</dt><dd>${esc(sv(a.svc).name)} (${a.size})</dd><dt>Thời gian</dt><dd>${fdate(a.date)} · ${a.start} - ${endT(a)}</dd><dt>Trạng thái</dt><dd><span class="${bc(a.status)}">${a.status}</span></dd><dt>Nhân viên</dt><dd>${esc(sf(a.staff).name)}</dd><dt>Giá</dt><dd>${pr(sv(a.svc),a.size)}</dd><dt>Ghi chú</dt><dd>${esc(a.note)||'—'}</dd></dl><div class="act"><button class="btn" onclick="closeM()">Đóng</button></div>`)}
function freeStaff(date,start,dur,ex){const t=tm(start),e=t+dur;return staff.filter(s=>shifts.some(h=>h.staff==s.id&&h.date==date&&tm(h.from)<=t&&tm(h.to)>=e)&&!ap.some(x=>x.id!=ex&&x.staff==s.id&&x.date==date&&x.status!='Đã hủy'&&t<tm(x.start)+sv(x.svc).dur&&tm(x.start)<e))}
function apForm(id){const a=id?ap.find(x=>x.id==id):{status:'Mới đặt',date:S.fd||today,start:'09:00',staff:''};
const so=svc.flatMap(x=>Object.keys(x.sizes).map(z=>[x.id+'|'+z,`${x.name} (${z}) – ${pr(x,z)} · ${x.dur} phút`])),init={...a,svc:id?a.svc+'|'+a.size:so[0][0]};
const fs=[...(id?[{k:'id',l:'Mã lịch hẹn',ro:1}]:[]),{k:'cust',l:'Tên khách hàng'},{k:'phone',l:'Số điện thoại',t:'tel'},{k:'date',l:'Ngày hẹn',t:'date'},{k:'svc',l:'Dịch vụ',t:'select',o:so},{k:'start',l:'Giờ bắt đầu',t:'time'},{k:'staff',l:'Nhân viên thực hiện (có ca làm hôm đó và còn trống giờ này)',t:'select',o:[]},{k:'status',l:'Trạng thái',t:'select',o:ST.map(x=>[x,x]),ro:!id},{k:'note',l:'Ghi chú',t:'area',opt:1}];
form(id?'Sửa lịch hẹn':'Tạo lịch hẹn',fs,init,o=>{const [sid,z]=o.svc.split('|');o.svc=sid;o.size=z;
if(!o.staff){alert('Chưa có nhân viên phù hợp. Hãy đổi ngày, giờ hoặc dịch vụ, hoặc tạo thêm ca làm việc cho nhân viên.');return false}
const t=tm(o.start),e=t+sv(sid).dur;
if(ap.some(x=>x.id!=id&&x.staff==o.staff&&x.date==o.date&&x.status!='Đã hủy'&&t<tm(x.start)+sv(x.svc).dur&&tm(x.start)<e)){alert('Nhân viên này đã có lịch trong khung giờ đó. Hãy chọn giờ hoặc nhân viên khác.');return false}
if(id)Object.assign(a,o,{id});else ap.push({...o,id:nid(ap,'LH')});rAppt()});
const f=$('#f'),sel=f.elements.staff;
const upd=()=>{const d=f.elements.date.value,st=f.elements.start.value,l=d&&st?freeStaff(d,st,sv(f.elements.svc.value.split('|')[0]).dur,id):[],cur=sel.value||a.staff;
sel.innerHTML=l.length?l.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''):'<option value="">Không có nhân viên phù hợp</option>';if(l.some(x=>x.id==cur))sel.value=cur};
['date','svc','start'].forEach(k=>f.elements[k].addEventListener('change',upd));upd()}
function apDel(id){ask('Xóa lịch hẹn '+id+'?',()=>{ap=ap.filter(x=>x.id!=id);rAppt()})}

/* ---------- Dịch vụ ---------- */
function rSvc(){const l=svc.filter(x=>(!S.sq||x.name.toLowerCase().includes(S.sq.toLowerCase()))&&(!S.sg||x.group==S.sg)),cols=own()?6:5;
$('#main').innerHTML=`<h2>Quản lý dịch vụ</h2><p class="sub">${own()?'Thêm, sửa, xóa dịch vụ và nhóm dịch vụ. Bấm vào một dòng để xem size và giá.':'Bấm vào một dòng để xem size, giá và ảnh minh họa (chỉ xem).'}</p>
<div class="bar"><input id="sq" placeholder="Tìm tên dịch vụ…" value="${esc(S.sq)}" aria-label="Tìm dịch vụ"><select id="sg" aria-label="Nhóm dịch vụ"><option value="">Tất cả nhóm dịch vụ</option>${G.map(g=>`<option ${S.sg==g?'selected':''}>${g}</option>`).join('')}</select><span class="sp"></span>${own()?'<button class="btn ghost" onclick="gForm()">+ Tạo nhóm dịch vụ</button><button class="btn" onclick="svForm()">+ Tạo dịch vụ</button>':''}</div>
<div class="card tw"><table><tr><th>Mã dịch vụ</th><th>Nhóm dịch vụ</th><th>Tên dịch vụ</th><th>Thời gian (phút)</th><th>Số NV cần</th>${own()?'<th class="ac">Thao tác</th>':''}</tr>
${l.map(x=>`<tr class="rw" tabindex="0" aria-expanded="${S.open==x.id}" onclick="S.open=S.open=='${x.id}'?'':'${x.id}';rSvc()" onkeydown="if(event.key=='Enter')this.click()"><td>${S.open==x.id?'▾':'▸'} ${x.id}</td><td>${x.group}</td><td>${esc(x.name)}</td><td>${x.dur}</td><td>${x.n}</td>${own()?`<td class="ac">${ib('edit','Sửa',`svForm('${x.id}')`)}${ib('del','Xóa',`svDel('${x.id}')`,'d')}</td>`:''}</tr>${S.open==x.id?`<tr class="dt"><td colspan="${cols}">${svDetail(x)}</td></tr>`:''}`).join('')||`<tr><td colspan="${cols}">Không tìm thấy dịch vụ.</td></tr>`}</table></div>`;
$('#sq').oninput=e=>{S.sq=e.target.value;const p=e.target.selectionStart;rSvc();const q=$('#sq');q.focus();q.setSelectionRange(p,p)};$('#sg').onchange=e=>{S.sg=e.target.value;rSvc()}}
const svDetail=x=>`<div class="dtw">${x.img?`<img class="ph" src="${x.img}" alt="Ảnh ${esc(x.name)}">`:`<div class="ph" aria-hidden="true">${esc(x.name[0])}</div>`}<div><b style="font-size:15px">${esc(x.name)}</b><div style="color:var(--mut);margin:2px 0 8px">${x.group} · ${x.dur} phút · ${x.n} nhân viên</div><table style="min-width:0;width:auto"><tr><th>Size</th><th>Loại tóc</th><th>Giá</th></tr>${Object.keys(x.sizes).map(z=>`<tr><td>${z}</td><td>${SZ[z]}</td><td>${pr(x,z)}</td></tr>`).join('')}</table></div></div>`;
function gForm(){if(!own())return;form('Tạo nhóm dịch vụ',[{k:'g',l:'Tên nhóm dịch vụ'}],{},o=>{const g=o.g.trim();if(G.includes(g)){alert('Nhóm này đã có.');return false}G.push(g);rSvc()})}
function svForm(id){if(!own())return;const x=id?svc.find(v=>v.id==id):{group:G[0],name:'',img:'',dur:60,n:1,unit:'',sizes:{}},zs=['S','M','L'];let img=x.img;
modal(`<h3>${id?'Sửa dịch vụ':'Tạo dịch vụ'}</h3><form id="f">${id?`<div class="fl"><span>Mã dịch vụ</span><input value="${x.id}" readonly></div>`:''}
<div class="fl"><span>Nhóm dịch vụ</span><select name="group" id="gsel">${G.map(g=>`<option ${g==x.group?'selected':''}>${g}</option>`).join('')}<option value="__new">+ Thêm nhóm mới…</option></select><input name="newg" id="newg" placeholder="Tên nhóm mới" hidden style="margin-top:6px"></div>
<div class="fl"><span>Tên dịch vụ</span><input name="name" value="${esc(x.name)}" required></div>
<div class="fl"><span>Ảnh minh họa</span><input type="file" id="img" accept="image/*"><img id="prev" class="ph" style="margin-top:6px" alt="Ảnh xem trước" ${img?`src="${img}"`:'hidden'}></div>
<div class="fl"><span>Các size và giá tương ứng từng size (đồng)</span>${zs.map(z=>`<div class="sz"><label><input type="checkbox" name="z${z}" style="width:auto" ${x.sizes[z]!=null||(!id&&z=='S')?'checked':''}> Size ${z}</label><span>${SZ[z]}</span><input type="number" min="0" name="p${z}" value="${x.sizes[z]??''}" style="width:130px" aria-label="Giá size ${z}"></div>`).join('')}</div>
<div class="fl"><span>Đơn vị tính giá (vd: tép; để trống nếu giá trọn gói)</span><input name="unit" value="${esc(x.unit)}"></div>
<div class="fl"><span>Thời gian thực hiện (số phút)</span><input type="number" name="dur" min="5" value="${x.dur}" required></div>
<div class="fl"><span>Số nhân viên thực hiện</span><input type="number" name="n" min="1" value="${x.n}" required></div>
<div class="act"><button type="button" class="btn ghost" onclick="closeM()">Hủy</button><button class="btn">Lưu</button></div></form>`);
$('#gsel').onchange=e=>{const n=e.target.value=='__new';$('#newg').hidden=!n;$('#newg').required=n};
$('#img').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>2e6){alert('Ảnh quá lớn, hãy chọn ảnh dưới 2 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{img=r.result;$('#prev').src=img;$('#prev').hidden=false};r.readAsDataURL(f)};
$('#f').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),sizes={};
if(!zs.some(z=>f.get('z'+z)))return alert('Hãy chọn ít nhất một size.');
if(zs.some(z=>f.get('z'+z)&&f.get('p'+z)===''))return alert('Hãy nhập giá cho mỗi size đã chọn.');
zs.forEach(z=>{if(f.get('z'+z))sizes[z]=+f.get('p'+z)});
let g=f.get('group');if(g=='__new'){g=f.get('newg').trim();if(!g)return;if(!G.includes(g))G.push(g)}
const o={group:g,name:f.get('name').trim(),img,sizes,unit:f.get('unit').trim(),dur:+f.get('dur'),n:+f.get('n')};
if(id)Object.assign(x,o);else svc.push({...o,id:nid(svc,'DV')});closeM();rSvc()}}
function svDel(id){if(ap.some(a=>a.svc==id))return alert('Dịch vụ này đang có lịch hẹn nên chưa thể xóa.');ask('Xóa dịch vụ '+id+'?',()=>{svc=svc.filter(x=>x.id!=id);rSvc()})}

/* ---------- Chat ---------- */
const MODE={bot:['Chatbot AI đang trả lời','s1','AI'],wait:['Khách yêu cầu gặp nhân viên','s2','Chờ NV'],staff:['Nhân viên đang trả lời','s3','NV']},NAMES=['Hoàng Yến','Mai Phương','Quốc Bảo','Thảo Vy','Anh Thư'];
function rChat(){const c=chats[S.chat],md=MODE[c.mode];N.forEach(n=>{if(n.ci==S.chat)n.read=true});head();
$('#main').innerHTML=`<h2>Theo dõi chat</h2><p class="sub">Chatbot AI tự động trả lời khách; nhân viên tiếp nhận khi khách yêu cầu</p>
<div class="bar"><span class="sp"></span><span style="color:var(--mut);font-size:12px">Demo thông báo:</span><button class="btn ghost sm" onclick="simNew()">Khách mới nhắn chatbot</button><button class="btn ghost sm" onclick="simHuman()">Khách xin gặp nhân viên</button></div>
<div class="card chat"><div class="cl">${chats.map((x,i)=>`<div class="ci ${i==S.chat?'on':''}" onclick="S.chat=${i};rChat()"><div class="av">${esc(x.name.split(' ').pop()[0])}</div><div><b>${esc(x.name)}</b> <span class="bd ${MODE[x.mode][1]}" style="font-size:11px">${MODE[x.mode][2]}</span><p>${esc(x.msgs[x.msgs.length-1].t)}</p></div></div>`).join('')}</div>
<div class="cw"><div class="ch" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${esc(c.name)}<span class="bd ${md[1]}">${md[0]}</span><span class="sp"></span>${c.mode=='staff'?`<button class="btn ghost sm" onclick="setMode('bot')">Giao lại cho chatbot</button>`:`<button class="btn sm" onclick="setMode('staff')">Tiếp nhận chat</button>`}</div>
<div class="cm" id="cm">${c.msgs.map(m=>`<div class="m ${m.from=='c'?'':m.from=='bot'?'bot':'me'}">${m.from=='bot'?'<small>Chatbot AI</small>':m.from=='staff'?'<small>Nhân viên</small>':''}${esc(m.t)}<small>${m.time}</small></div>`).join('')}</div>
<form class="cf" id="cf"><input id="ct" placeholder="${c.mode=='bot'?'Gửi tin sẽ chuyển sang nhân viên trả lời…':'Nhập tin nhắn…'}" autocomplete="off" aria-label="Tin nhắn"><button class="btn">Gửi</button></form></div></div>`;
const cm=$('#cm');cm.scrollTop=cm.scrollHeight;$('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ct').value.trim();if(!v)return;c.msgs.push({t:v,from:'staff',time:now()});c.mode='staff';rChat();$('#ct').focus()}}
function setMode(m){chats[S.chat].mode=m;rChat()}
function simNew(){const nm=NAMES[chats.length%NAMES.length]+(chats.length>=NAMES.length+4?' '+chats.length:'');chats.push({name:nm,mode:'bot',msgs:[{t:'Salon ơi cho mình hỏi giá uốn tóc với ạ',from:'c',time:now()},{t:'Dạ chào chị! Uốn (sản phẩm ART) size S 229.000đ, M 249.000đ, L 279.000đ ạ. Chị cho em biết độ dài tóc để em tư vấn nhé.',from:'bot',time:now()}]});N.unshift({k:'new',ci:chats.length-1,time:now(),read:false});rChat()}
function simHuman(){const i=chats.findIndex((c,j)=>c.mode=='bot'&&j!=S.chat),j=i<0?S.chat:i,c=chats[j];if(c.mode!='bot')return alert('Các khách còn lại đã yêu cầu gặp nhân viên hoặc đang được nhân viên trả lời. Hãy bấm "Khách mới nhắn chatbot" để tạo khách mới.');c.msgs.push({t:'Cho mình gặp nhân viên với.',from:'c',time:now()},{t:'Em đã báo nhân viên hỗ trợ, chị chờ trong giây lát nhé.',from:'bot',time:now()});c.mode='wait';N.unshift({k:'human',ci:j,time:now(),read:false});rChat()}

/* ---------- Nhân viên & lịch làm việc ---------- */
function rStaff(){if(!own())return nav('appt');
$('#main').innerHTML=`<h2>Quản lý nhân viên & lịch làm việc</h2><p class="sub">Hồ sơ thợ và ca làm trong tháng</p><div class="tabs"><button class="tab ${S.tab=='list'?'on':''}" onclick="S.tab='list';rStaff()">Danh sách nhân viên</button><button class="tab ${S.tab=='cal'?'on':''}" onclick="S.tab='cal';rStaff()">Lịch làm việc</button></div>${S.tab=='list'?stList():stCal()}`}
function stList(){return `<div class="bar"><span class="sp"></span><button class="btn" onclick="stForm()">+ Tạo nhân viên</button></div><div class="card tw"><table><tr><th>Thao tác</th><th>Mã NV</th><th>Tên nhân viên</th><th>Số điện thoại</th><th>Địa chỉ</th><th>CCCD</th><th>Ngày vào làm</th><th>Năng lực</th></tr>${staff.map(s=>`<tr><td><button class="btn ghost sm" onclick="stForm('${s.id}')">Sửa</button><button class="btn ghost sm" onclick="stDel('${s.id}')">Xóa</button></td><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.addr)}</td><td>${esc(s.cccd)}</td><td>${fdate(s.join)}</td><td>${s.skills.join(', ')}</td></tr>`).join('')}</table></div>`}
function stForm(id){const s=id?staff.find(x=>x.id==id):{skills:[],join:today};
form(id?'Sửa nhân viên':'Tạo nhân viên',[...(id?[{k:'id',l:'Mã nhân viên',ro:1}]:[]),{k:'name',l:'Tên nhân viên'},{k:'phone',l:'Số điện thoại',t:'tel'},{k:'addr',l:'Địa chỉ'},{k:'cccd',l:'CCCD'},{k:'join',l:'Ngày vào làm',t:'date'},{k:'skills',l:'Năng lực (loại dịch vụ làm được)',t:'checks',o:G}],s,o=>{if(id)Object.assign(s,o,{id});else staff.push({...o,id:nid(staff,'NV')});rStaff()})}
function stDel(id){ask('Xóa nhân viên '+id+'? Các ca làm của nhân viên này cũng bị xóa.',()=>{staff=staff.filter(x=>x.id!=id);shifts=shifts.filter(x=>x.staff!=id);rStaff()})}
function stCal(){const m=S.cm,y=m.getFullYear(),mo=m.getMonth(),off=(m.getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),cells=Math.ceil((off+dim)/7)*7;
let h=`<div class="bar"><button class="btn ghost" onclick="S.cm=new Date(${y},${mo-1},1);rStaff()" aria-label="Tháng trước">‹</button><b style="min-width:110px;text-align:center">Tháng ${mo+1}/${y}</b><button class="btn ghost" onclick="S.cm=new Date(${y},${mo+1},1);rStaff()" aria-label="Tháng sau">›</button><button class="btn ghost" onclick="S.cm=new Date(new Date().getFullYear(),new Date().getMonth(),1);rStaff()">Hôm nay</button><span class="sp"></span><button class="btn" onclick="shForm()">+ Tạo lịch làm việc</button></div><div class="card"><div class="cal">${['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<div class="h">${d}</div>`).join('')}`;
for(let i=0;i<cells;i++){const d=new Date(y,mo,1-off+i),k=ymd(d),sh=shifts.filter(s=>s.date==k);
h+=`<div class="cd ${d.getMonth()!=mo?'o':''} ${k==today?'td':''}" onclick="shForm('${k}')"><b>${d.getDate()}</b>${sh.map(s=>`<span class="chip" style="background:${COL[staff.findIndex(x=>x.id==s.staff)%5]}" title="Bấm để xóa ca" onclick="event.stopPropagation();shDel(${s.id})">${esc(sf(s.staff).name?.split(' ').pop())} ${s.from}-${s.to}</span>`).join('')}</div>`}
return h+'</div></div>'}
function shForm(d){form('Tạo lịch làm việc',[{k:'staff',l:'Nhân viên',t:'select',o:staff.map(s=>[s.id,s.name])},{k:'date',l:'Ngày làm',t:'date'},{k:'from',l:'Từ giờ',t:'time'},{k:'to',l:'Đến giờ',t:'time'}],{date:typeof d=='string'?d:today,from:'08:00',to:'17:00'},o=>{if(tm(o.to)<=tm(o.from)){alert('Giờ kết thúc phải sau giờ bắt đầu.');return false}shifts.push({...o,id:Math.max(0,...shifts.map(s=>s.id))+1});rStaff()})}
function shDel(id){ask('Xóa ca làm này?',()=>{shifts=shifts.filter(s=>s.id!=id);rStaff()})}
</script></body></html>
