<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký/Đăng nhập — Mây Hair Studio</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/account.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <span class="brand-logo-pill">M</span>
        <span>Mây Hair Studio</span>
      </a>
      <button class="navbar-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
      <ul class="navbar-nav" id="nav-menu">
        <li><a href="/">Trang chủ</a></li>
        <li><a href="/products.html">Tất cả dịch vụ</a></li>
        <li><a href="/#danh-gia">Đánh giá</a></li>
        <li><a href="/#lien-he">Liên hệ</a></li>
        <li><a href="/account.html" aria-current="page">Đăng ký/Đăng nhập</a></li>
      </ul>
    </div>
  </header>

  <main class="container section account-main">
    <section class="card account-card">
      <div id="account-status" class="account-status" role="status" aria-live="polite" hidden></div>
      <div id="account-forms">
        <div class="section-title account-heading">
          <h1 style="font-size: 1.7rem;">Tài khoản khách hàng</h1>
          <p>Đăng nhập hoặc tạo tài khoản để lưu thông tin tư vấn.</p>
        </div>
        <div class="account-tabs" role="tablist" aria-label="Chọn hình thức tài khoản">
          <button type="button" class="account-tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login">Đăng nhập</button>
          <button type="button" class="account-tab" id="tab-register" role="tab" aria-selected="false" aria-controls="form-register">Đăng ký</button>
        </div>
        <form id="form-login" class="account-form" novalidate>
          <div class="form-group account-field">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" id="login-email" class="form-control" autocomplete="email" required aria-describedby="login-email-error">
            <span class="field-error" id="login-email-error" aria-live="polite"></span>
          </div>
          <div class="form-group account-field">
            <label class="form-label" for="login-password">Mật khẩu</label>
            <input type="password" id="login-password" class="form-control" autocomplete="current-password" required aria-describedby="login-password-error">
            <span class="field-error" id="login-password-error" aria-live="polite"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-full account-submit">Đăng nhập</button>
        </form>
        <form id="form-register" class="account-form" novalidate hidden>
          <div class="form-group account-field">
            <label class="form-label" for="reg-name">Họ và tên</label>
            <input type="text" id="reg-name" class="form-control" autocomplete="name" required aria-describedby="reg-name-error">
            <span class="field-error" id="reg-name-error" aria-live="polite"></span>
          </div>
          <div class="form-group account-field">
            <label class="form-label" for="reg-email">Email</label>
            <input type="email" id="reg-email" class="form-control" autocomplete="email" required aria-describedby="reg-email-error">
            <span class="field-error" id="reg-email-error" aria-live="polite"></span>
          </div>
          <div class="form-group account-field">
            <label class="form-label" for="reg-phone">Số điện thoại</label>
            <input type="tel" id="reg-phone" class="form-control" autocomplete="tel" aria-describedby="reg-phone-error">
            <span class="field-error" id="reg-phone-error" aria-live="polite"></span>
          </div>
          <div class="form-group account-field">
            <label class="form-label" for="reg-password">Mật khẩu (tối thiểu 8 ký tự)</label>
            <input type="password" id="reg-password" class="form-control" autocomplete="new-password" minlength="8" required aria-describedby="reg-password-error">
            <span class="field-error" id="reg-password-error" aria-live="polite"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-full account-submit">Tạo tài khoản</button>
        </form>
      </div>
      <div id="account-profile" hidden>
        <div class="section-title">
          <h1 style="font-size: 1.7rem;">Tài khoản của bạn</h1>
          <p id="account-name"></p>
          <p id="account-email"></p>
        </div>
        <button type="button" id="btn-logout" class="btn btn-outline btn-full">Đăng xuất</button>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
